services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hvac-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hvac
      POSTGRES_USER: hvac_user
      POSTGRES_PASSWORD: hvac_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hvac-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac_user -d hvac"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
    networks:
      - hvac-net

  nodered:
    image: nodered/node-red:latest
    container_name: hvac-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=America/Mexico_City
    depends_on:
      - mosquitto
    networks:
      - hvac-net

  backend:
    build:
      context: ./backend
      target: development        # uses the dev stage: full npm ci + start:dev watch
    container_name: hvac-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app                        # mount source for hot-reload
      - backend_node_modules:/app/node_modules # named volume keeps container's node_modules intact
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: hvac/#
      CORS_ORIGIN: "*"
      PORT: 3000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hvac_user
      DB_PASSWORD: hvac_pass
      DB_NAME: hvac
      DATA_RETENTION_DAYS: 90
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - hvac-net

  frontend:
    build:
      context: ./hvac-frontend
    container_name: hvac-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hvac-net

volumes:
  backend_node_modules:   # named volume so it survives restarts but stays fresh per image build
  pgdata:                 # persistent PostgreSQL data volume

networks:
  hvac-net:
    driver: bridge
