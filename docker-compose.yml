services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
    networks:
      - hvac-net

  nodered:
    image: nodered/node-red:latest
    container_name: hvac-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=America/Mexico_City
    depends_on:
      - mosquitto
    networks:
      - hvac-net

  backend:
    build:
      context: ./backend
      target: development        # uses the dev stage: full npm ci + start:dev watch
    container_name: hvac-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app                        # mount source for hot-reload
      - backend_node_modules:/app/node_modules # named volume keeps container's node_modules intact
      - ./backend/data:/app/data              # persist SQLite database
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: hvac/#
      CORS_ORIGIN: "*"
      PORT: 3000
      NODE_ENV: development
    depends_on:
      - mosquitto
    networks:
      - hvac-net

  frontend:
    build:
      context: ./hvac-frontend
    container_name: hvac-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hvac-net

volumes:
  backend_node_modules:   # named volume so it survives restarts but stays fresh per image build

networks:
  hvac-net:
    driver: bridge
